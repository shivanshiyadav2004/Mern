<!-- covrting api into html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Users</title>

    <script>
        const fetchData = () => {
            fetch('https://jsonplaceholder.typicode.com/users')
                .then(res => res.json())
                .then(data => {
                    data.forEach(user => {
                        const li = document.createElement("li");
                        li.innerHTML = user.email + " - " + user.name + " - " + user.username;
                        document.getElementById("list").appendChild(li);
                    });
                })
                .catch(error => console.log(error));
        };
    </script>
</head>
<body>

    <button onclick="fetchData()">Show Me</button>

    <ul id="list"></ul>

</body>
</html>
