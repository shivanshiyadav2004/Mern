<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>
        Registeration Form
    </h1>
    <label for="Name">First Name:</label>
    <input type="text" name="" id="" placeholder="Enter your name">
    <label for="Name">Last Name:</label>
    <input type="text" name="" id="" placeholder="Enter your last name"><br><br>
    <label for="Email">Email:</label>
    <input type="email" name="" id="" placeholder="Enter your email">
    <label for="Password">Password:</label>
    <input type="password" name="" id="" placeholder="Enter your password"><br><br>
    <label for="Date">DOB:</label>
    <input type="date" name="" id="" placeholder="Enter date"><br><br>
    <label for="Gender">Gender:</label>
    <input type="radio" name="gender" id="" value="Male">Male
    <input type="radio" name="gender" id="" value="Female">Female <br><br>
    <label for="Number">Phone Number:</label>
    <input type="number" name="" id="" placeholder="Enter your phone number"><br><br>
    <label for="Suggestion">Suggestions:</label>
    <textarea name="" id="" cols="30" rows="10" placeholder="Enter your suggestions"></textarea><br><br>
    <label for="File">Upload your file:</label>
    <input type="file" name="" id=""><br><br> 
    <label for="Color">Choose your favorite color:</label>
    <input type="color" name="" id=""><br><br>   
    <input type="submit" value="Submit">  
</body>
</html>
